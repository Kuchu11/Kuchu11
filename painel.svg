<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 610" width="500" height="610" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a2a"/>
      <stop offset="1" stop-color="#06101c"/>
    </linearGradient>
    <linearGradient id="btnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="btnGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- painel -->
  <rect x="2" y="2" width="496" height="606" rx="14" fill="url(#panelBg)" stroke="#5ee7f0" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="3" y="3" width="494" height="604" rx="13" fill="none" stroke="#5ee7f0" stroke-opacity="0.06" stroke-width="10"/>

  <!-- título -->
  <text x="34" y="72" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji'" font-size="31" font-weight="700" fill="#5ee7f0" filter="url(#glow)">Wesley Amorim 👋</text>
  <line x1="34" y1="98" x2="466" y2="98" stroke="#2bb5c9" stroke-opacity="0.25" stroke-width="1"/>

  <!-- itens -->
  <g font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji'" font-size="17" fill="#e6f1f5">
    <text x="34" y="152" font-size="24">🚀</text>
    <text x="80" y="150">Desenvolvedor de Software em formação</text>
    <text x="80" y="177">pela <tspan font-weight="600" fill="#ffffff">Unifor</tspan>.</text>

    <text x="34" y="232" font-size="24">💻</text>
    <text x="80" y="230">Construindo aplicações modernas com foco</text>
    <text x="80" y="257">atual em <tspan font-weight="600" fill="#5ee7f0">tecnologias Web</tspan>.</text>

    <text x="34" y="312" font-size="24">🤖</text>
    <text x="80" y="310">Otimizando o fluxo de desenvolvimento e</text>
    <text x="80" y="337">código com o uso de <tspan font-weight="600" fill="#5ee7f0">IA</tspan>.</text>
  </g>

  <!-- rodapé do painel -->
  <line x1="34" y1="508" x2="466" y2="508" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- botão LinkedIn -->
  <g filter="url(#btnGlow)">
    <rect x="34" y="530" width="158" height="46" rx="10" fill="url(#btnBg)" stroke="#38bdf8" stroke-width="1.2"/>
  </g>
  <g transform="translate(58,543) scale(0.8333)" fill="#ffffff">
    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
  </g>
  <text x="88" y="559" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">LinkedIn</text>

  <!-- status -->
  <text x="34" y="597" font-family="'Courier New', monospace, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji'" font-size="12" fill="#5ee7f0" fill-opacity="0.75"></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
